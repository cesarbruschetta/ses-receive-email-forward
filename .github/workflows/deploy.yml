name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ses-email-forwarder >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name ses-email-forwarder

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ses-email-forwarder:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ses-email-forwarder:latest
            ${{ steps.ecr.outputs.registry }}/ses-email-forwarder:${{ github.ref_name }}

  terraform:
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ses-email-forwarder/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"

      - name: Import ECR repository into Terraform state
        run: |
          terraform -chdir=infra import \
            -var="ecr_repository_name=ses-email-forwarder" \
            aws_ecr_repository.lambda ses-email-forwarder || true

      - name: Terraform plan
        env:
          TF_VAR_forward_addresses: ${{ secrets.FORWARD_ADDRESSES_JSON }}
        run: |
          terraform -chdir=infra plan \
            -var="aws_region=us-east-1" \
            -var="project_name=ses-email-forwarder" \
            -var="email_bucket_name=${{ secrets.EMAIL_BUCKET_NAME }}" \
            -var="sns_topic_name=ses-email-forwarder-topic" \
            -var="ses_rule_set_name=ses-email-forwarder-rules" \
            -var="ecr_repository_name=ses-email-forwarder" \
            -var="from_address=${{ secrets.FROM_ADDRESS }}" \
            -var="logger_level=INFO" \
            -var="lambda_image_uri=${{ needs.docker.outputs.ecr_registry }}/ses-email-forwarder:${{ github.ref_name }}"

      - name: Terraform apply
        env:
          TF_VAR_forward_addresses: ${{ secrets.FORWARD_ADDRESSES_JSON }}
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var="aws_region=us-east-1" \
            -var="project_name=ses-email-forwarder" \
            -var="email_bucket_name=${{ secrets.EMAIL_BUCKET_NAME }}" \
            -var="sns_topic_name=ses-email-forwarder-topic" \
            -var="ses_rule_set_name=ses-email-forwarder-rules" \
            -var="ecr_repository_name=ses-email-forwarder" \
            -var="from_address=${{ secrets.FROM_ADDRESS }}" \
            -var="logger_level=INFO" \
            -var="lambda_image_uri=${{ needs.docker.outputs.ecr_registry }}/ses-email-forwarder:${{ github.ref_name }}"
