name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ses-email-forwarder >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name ses-email-forwarder

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/ses-email-forwarder:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/ses-email-forwarder:latest

  terraform:
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform -chdir=infra init

      - name: Import ECR repository into Terraform state
        run: |
          terraform -chdir=infra import aws_ecr_repository.lambda ses-email-forwarder || true

      - name: Terraform plan and apply
        env:
          TF_VAR_lambda_image_tag: ${{ needs.docker.outputs.image-tag }}
          TF_VAR_forward_addresses: ${{ vars.FORWARD_ADDRESSES_JSON }}
          TF_VAR_ses_recipient_addresses: ${{ vars.SES_RECIPIENT_ADDRESSES_JSON }}
        run: |
          terraform -chdir=infra plan
          terraform -chdir=infra apply -auto-approve
